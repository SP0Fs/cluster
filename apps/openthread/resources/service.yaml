apiVersion: v1
kind: Service
metadata:
  name: openthread-border-router
  namespace: openthread
  labels:
    app: openthread-border-router
spec:
  # Headless: pod's network namespace == host's, so the cluster IP is
  # meaningless. Keep a Service for cluster-DNS resolution (HA Matter
  # integration reaches OTBR at otbr-rest.openthread.svc:8081) and for
  # Ingress routing.
  clusterIP: None
  selector:
    app: openthread-border-router
  ports:
    - name: web
      port: 8080
      targetPort: 8080
    - name: rest
      port: 8081
      targetPort: 8081