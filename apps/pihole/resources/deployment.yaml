apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
  labels:
    app: pihole
spec:
  replicas: 2 # one per network
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: network
                    operator: Exists
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: network
              labelSelector:
                matchLabels:
                  app: pihole
      volumes:
        - name: pihole-config
          hostPath:
            path: /mnt/pihole
            type: DirectoryOrCreate
        - name: pihole-adlists-list
          configMap:
            name: pihole-adlists-list
      containers:
        - name: cloudflared
          image: visibilityspots/cloudflared:v2026.1.2
          env:
            - name: PORT
              value: "5053"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
        - name: pihole
          image: pihole/pihole:2026.10.1
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          env:
            - name: TZ
              value: Europe/Berlin
            - name: FTLCONF_dns_upstreams
              value: 127.0.0.1#5053
            - name: FTLCONF_dns_listeningMode
              value: all
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: pihole-webpassword
                  key: WEBPASSWORD
          ports:
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 80
              name: http
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/pihole
              name: pihole-config
            - mountPath: /etc/pihole/adlists.list
              name: pihole-adlists-list
              subPath: adlists.list
