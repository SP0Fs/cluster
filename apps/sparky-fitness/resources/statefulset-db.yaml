apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sparkyfitness-db
  namespace: sparky-fitness
  labels:
    app: sparkyfitness-db
spec:
  replicas: 1
  # StatefulSet (not Deployment): a replacement pod is only created after the old one has fully
  # terminated, so two postgres instances never run on the same data dir — not even when the
  # pod is deleted or evicted (Deployment+Recreate only guarantees that during rollouts).
  serviceName: sparkyfitness-db
  selector:
    matchLabels:
      app: sparkyfitness-db
  template:
    metadata:
      labels:
        app: sparkyfitness-db
    spec:
      # Room for a clean shutdown checkpoint before SIGKILL (image stop signal = SIGINT, fast shutdown).
      terminationGracePeriodSeconds: 120
      # Data lives on hp-elitedesk's local disk (pvc-db.yaml) — must stay on that node.
      nodeSelector:
        kubernetes.io/hostname: hp-elitedesk
      # hostPath DirectoryOrCreate makes /mnt/sparky-db root-owned; hand it to postgres (uid 70).
      initContainers:
        - name: chown-data
          image: busybox:1.37
          command: ["sh", "-c", "chown 70:70 /var/lib/postgresql && chmod 700 /var/lib/postgresql"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      containers:
        - name: postgres
          image: postgres:18.3-alpine
          # Start directly as the image's postgres user (uid/gid 70). As root, the entrypoint
          # drops privileges via gosu, which hung at 100% CPU and never started postgres.
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
          ports:
            - containerPort: 5432
          env:
            # Only read on first init — do not change on an existing instance.
            - name: POSTGRES_DB
              value: sparkyfitness_db
            - name: POSTGRES_USER
              value: sparky
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sparkyfitness-secrets
                  key: SPARKY_FITNESS_DB_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sparky", "-d", "sparkyfitness_db"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sparkyfitness-db
