apiVersion: apps/v1
kind: Deployment
metadata:
  name: grocy
  namespace: grocy
  labels:
    app.kubernetes.io/name: grocy
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # SQLite on a RWO volume: never run two pods at once
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grocy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grocy
    spec:
      containers:
        - name: grocy
          # linuxserver's "latest" tracks stable Grocy releases (there is no "stable" tag);
          # Always pulls the newest build on every pod restart, like Home Assistant
          image: lscr.io/linuxserver/grocy:latest
          imagePullPolicy: Always
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Berlin"
            # Grocy reads any config.php setting from GROCY_<SETTING>
            - name: GROCY_DEFAULT_LOCALE
              value: "de"
            - name: GROCY_CURRENCY
              value: "EUR"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: grocy-config
