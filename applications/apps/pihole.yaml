apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pihole
  namespace: argo-cd
spec:
  project: spof-cluster
  source:
    repoURL: "https://github.com/SP0Fs/cluster.git"
    targetRevision: main
    path: apps/pihole/resources
  destination:
    server: "https://kubernetes.default.svc"
    namespace: pihole
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Client-side apply merges container/service ports by port number only, so
      # the two port-53 entries (TCP + UDP) get mixed up on every apply and
      # selfHeal re-rolls the Deployment forever. Server-side apply keys them by
      # port + protocol.
      - ServerSideApply=true
