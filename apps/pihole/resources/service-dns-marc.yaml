apiVersion: v1
kind: Service
metadata:
  name: pihole-dns-marc
  namespace: pihole
  annotations:
    metallb.io/address-pool: marc-local
    metallb.io/loadBalancerIPs: 192.168.178.128
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: pihole
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
