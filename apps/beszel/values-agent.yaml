# Cluster-specific overrides for the official beszel-agent Helm chart.
# Reference upstream values: https://github.com/henrygd/beszel/blob/main/supplemental/helm/beszel-agent/values.yaml

# Pin to a specific image tag instead of `:latest`.
image:
  repository: henrygd/beszel-agent
  tag: ""           # falls back to chart appVersion (currently 0.19.0)
  pullPolicy: IfNotPresent

# DaemonSet (one agent per node) — matches the previous raw manifest.
daemonset:
  enabled: true

# Reference the Secret by name — it must exist before the agent chart
# can render. The Secret is managed out-of-band as a SealedSecret (see
# apps/beszel/secrets/beszel-hub-public-key.yaml) so the SSH public key
# never lives in plain text in the cluster repo.
#
# Bootstrap procedure:
#   1. Get the hub's public key (one-time, after the first sync creates
#      the hub and it has generated its ed25519 keypair on the PVC):
#
#        HUB_POD=$(kubectl -n monitoring get pod \
#          -l app=beszel-hub \
#          -o jsonpath='{.items[0].metadata.name}')
#        kubectl -n monitoring exec "$HUB_POD" -- \
#          cat /beszel_data/id_ed25519.pub
#
#   2. Re-seal the key into apps/beszel/secrets/beszel-hub-public-key.yaml
#      and commit.
#
#   3. ArgoCD's self-heal picks up the new Secret within seconds and
#      starts the agent DaemonSet on both nodes.
secret:
  existingSecret: beszel-hub-public-key
  sshKey: ssh-key
  tokenKey: token

# Hub URL (service DNS inside the same namespace).
env:
  HUB_URL: "http://beszel-hub.monitoring.svc.cluster.local:8090"
  # KEY stays empty on purpose — see secret.existingSecret docs above.
  KEY: ""
  TOKEN: ""

# Tolerate control-plane taints — k3s labels nodes with
# node-role.kubernetes.io/control-plane, and we want metrics from them too.
tolerations:
  - operator: Exists
    effect: NoSchedule
  - operator: Exists
    effect: NoExecute
