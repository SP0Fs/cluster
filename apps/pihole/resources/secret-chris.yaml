# Web UI password of the chris Pi-hole (key WEBPASSWORD).
# Strict scope: the value is bound to this name + namespace, so seal it with
#   --name chris-pihole-webpassword --namespace pihole
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: chris-pihole-webpassword
  namespace: pihole
spec:
  encryptedData:
    WEBPASSWORD: 
  template:
    metadata:
      name: chris-pihole-webpassword
      namespace: pihole
    type: Opaque
