apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  namespace: matter
  labels:
    app: matter-server
spec:
  selector:
    matchLabels:
      app: matter-server
  replicas: 1
  # Recreate: the Matter fabric is stateful (one controller per fabric),
  # so we tear down the old pod before starting the new one. Mirrors the
  # zigbee2mqtt and openthread patterns.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: matter-server
    spec:
      # Co-locate with the OTBR pod on hp-elitedesk. Matter Server needs
      # to send IPv6 UDP traffic to devices sitting on the Thread mesh
      # (mesh-local prefixes like fd74:ce3d:... or fd40:3d95:...); the
      # only path from this pod to those addresses is via OTBR's wpan0
      # + eno1 routes, which exist on the OTBR node. Without this
      # nodeSelector Matter Server ends up on c-nuc7 (the kube-scheduler
      # picks any node with capacity), gets "Network is unreachable" when
      # it tries to commission Thread devices, and the Matter fabric
      # can't grow.
      #
      # Bumping this when you spin up a second OTBR node: change this to
      # match the new node, or remove the selector and add a topology
      # spread constraint that keeps Matter on the same node as OTBR.
      nodeSelector:
        kubernetes.io/hostname: hp-elitedesk
      # hostNetwork: Matter needs the host's network namespace so it can
      # reach OTBR's wpan0 interface and route to Thread mesh-local
      # prefixes (fd00::/8 etc.). Without hostNetwork, Matter sits in
      # its own pod network namespace, can't see wpan0, and gets
      # "Network is unreachable" when it tries to commission devices on
      # the Thread mesh. This mirrors the OTBR Deployment's hostNetwork
      # setting for the same reason. dnsPolicy: ClusterFirstWithHostNet
      # preserves CoreDNS resolution from inside the host network stack
      # so the pod can still resolve matter-server.matter.svc.cluster.local
      # (used by the WebSocket URL HA connects to). zigbee2mqtt does NOT
      # need hostNetwork — it talks to its dongle via Akri's device-plugin
      # in the pod network namespace and communicates with HA over LAN,
      # not over a custom mesh.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: matter-server
          # Open Home Foundation Matter Server, matter.js rewrite. Drop-in
          # replacement for the archived python-matter-server (same
          # WebSocket API on 5580, reads/migrates the Python data files in
          # /data on first start and keeps <fabric>.json in sync, so a
          # rollback to python-matter-server on the same PVC is possible).
          # Provides the Thread/WiFi network map in HA's Matter panel.
          # Docs: https://github.com/matter-js/matterjs-server/blob/main/docs/docker.md
          image: ghcr.io/matter-js/matterjs-server:stable
          imagePullPolicy: Always
          # Same args as the Python server, minus --paa-root-cert-dir
          # (unsupported in matter.js; DCL certificates are handled
          # internally). --ota-provider-dir points at the dedicated
          # matter-updates PVC.
          args:
            - "--storage-path"
            - "/data"
            - "--ota-provider-dir"
            - "/data/updates"
          ports:
            - containerPort: 5580
              name: ws
              protocol: TCP
          env:
            # Pin the interface used for mDNS/Matter traffic. With
            # hostNetwork the pod sees eno1, wpan0, CNI bridges, etc.;
            # auto-detect could pick the wrong one.
            - name: PRIMARY_INTERFACE
              value: eno1
            - name: LOG_LEVEL
              value: info
            # Plain log output (no ANSI colours) for kubectl logs.
            - name: MATTER_LOG_FORMAT
              value: plain
            - name: TZ
              value: Europe/Berlin
            # Node.js has no heap limit by default; cap V8 old-space at
            # ~75 % of the container memory limit so GC kicks in before
            # the kernel OOM-kills the pod.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: ws
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: ws
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            # The matter.js image runs as unprivileged uid 1000 by default;
            # existing /data files are already owned by 1000:1000.
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
            # Writable scratch space for /tmp, since the root FS is
            # read-only.
            - name: tmp
              mountPath: /tmp
            # OTA firmware blobs + provider KVS + per-update logs go
            # here (see --ota-provider-dir above). Separate PVC from
            # matter-data so a runaway OTA cache can't fill up the
            # fabric storage, and so PVC resize cycles don't risk
            # the Matter fabric's persistent state.
            - name: updates
              mountPath: /data/updates
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matter-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: updates
          persistentVolumeClaim:
            claimName: matter-updates
