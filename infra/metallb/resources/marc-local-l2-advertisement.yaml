apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: marc-local
  namespace: metallb
spec:
  ipAddressPools:
    - marc-local
  # Pin L2 announcements to the .178-segment node. c-nuc7 has no .178 interface,
  # so an L2 announcer there sends gratuitous ARPs the .178 switch ignores.
  # Nodes are labeled topology.kubernetes.io/zone=<network> (hp-elitedesk=marc).
  nodeSelectors:
    - matchLabels:
        topology.kubernetes.io/zone: marc
