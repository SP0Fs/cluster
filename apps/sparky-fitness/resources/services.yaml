apiVersion: v1
kind: Service
metadata:
  name: sparkyfitness-db
  namespace: sparky-fitness
spec:
  selector:
    app: sparkyfitness-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: sparkyfitness-server
  namespace: sparky-fitness
spec:
  selector:
    app: sparkyfitness-server
  ports:
    - name: http
      port: 3010
      targetPort: 3010
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: sparkyfitness-frontend
  namespace: sparky-fitness
spec:
  selector:
    app: sparkyfitness-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
