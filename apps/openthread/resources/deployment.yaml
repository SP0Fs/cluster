apiVersion: apps/v1
kind: Deployment
metadata:
  name: openthread-border-router
  namespace: openthread
  labels:
    app: openthread-border-router
spec:
  selector:
    matchLabels:
      app: openthread-border-router
  replicas: 1
  # Recreate is mandatory: the serial device is exclusive to one pod, and
  # the host's wpan0 interface cannot coexist across two replicas. Matches
  # the zigbee2mqtt pattern.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: openthread-border-router
    spec:
      # Schedule on hp-elitedesk — that's where both USB dongles live.
      nodeSelector:
        kubernetes.io/hostname: hp-elitedesk
      # hostNetwork is REQUIRED by OTBR (s6 services bind to host's loopback,
      # mDNSResponder publishes to host's interfaces). dnsPolicy preserves
      # CoreDNS resolution so the pod can still resolve cluster service DNS.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: otbr
          image: openthread/border-router:v2026.09.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              # Akri resource — only schedule when the E dongle is present.
              # Mirrors the zigbee2mqtt pattern.
              akri.sh/akri-openthread-usb: "1"
              cpu: 50m
              memory: 64Mi
            limits:
              akri.sh/akri-openthread-usb: "1"
              cpu: 200m
              memory: 256Mi
          env:
            # RCP over the SMLIGHT SLZB-07Mg24 (replaced the ZBDongle-E on
            # 2026-10-11). Akri injects the device matching the OTBR Akri
            # Configuration's serial at its host path; on hp-elitedesk that is
            # /dev/ttyUSB1 (check `ls -l /dev/serial/by-id/` if USB devices
            # are added or removed, the ttyUSB numbering can shift).
            # Firmware: SL-OPENTHREAD/2.7.2.0 RCP at 460800 baud. SMLIGHT
            # documents hardware flow control as ENABLED for SLZB-07Mg24,
            # hence &uart-flow-control. Baud mismatch causes silent Init
            # failure in spinel_driver.cpp with no further error detail.
            # See docs/research/otbr-operational-issues-2026-10-05.md.
            - name: OT_RCP_DEVICE
              value: "spinel+hdlc+uart:///dev/ttyUSB1?uart-baudrate=460800&uart-flow-control"
            # Infra interface on hp-elitedesk is eno1 (verified via `ip route`).
            # OTBR uses this for upstream IPv6 reachability to the LAN.
            - name: OT_INFRA_IF
              value: "eno1"
            # Default, but explicit so future readers don't have to check.
            - name: OT_THREAD_IF
              value: "wpan0"
            # 5 = notice (7 = debug logs every Spinel frame, use only when
            # diagnosing the RCP link).
            - name: OT_LOG_LEVEL
              value: "5"
            # Both HTTP ports default-bind to 127.0.0.1; override so HA and
            # the browser can reach them. With hostNetwork=true, "0.0.0.0"
            # binds to all host interfaces.
            - name: OT_WEB_LISTEN_ADDR
              value: "0.0.0.0"
            - name: OT_REST_LISTEN_ADDR
              value: "0.0.0.0"
            # NOTE: do NOT set OTBR_NFTABLES=1 here. The v2026.09.0 image was
            # built WITHOUT nftables support (the marker file
            # /usr/share/otbr/nftables-backend is absent). With OTBR_NFTABLES=1
            # the wrapper script skips the legacy ipset/ip6tables init and
            # expects an in-process nftables backend that doesn't exist, so
            # the firewall setup silently fails — and OTBR's Border Agent
            # MeshCoP service never becomes active. Leaving OTBR_NFTABLES
            # unset (or =0) lets the wrapper use the working legacy path.
            # Removed 2026-09-30 after diagnosis from cluster logs.
          ports:
            # Documentation only — hostNetwork makes these bind to the host's
            # interfaces directly. Service ports below match.
            - containerPort: 8080
              name: web
              protocol: TCP
            - containerPort: 8081
              name: rest
              protocol: TCP
            - containerPort: 19791
              name: meshcop
              protocol: UDP
          securityContext:
            # NOT privileged — NET_ADMIN is sufficient.
            capabilities:
              add:
                - NET_ADMIN
                # IPC_LOCK lets mDNSResponder mlock() its pages; matches HA
                # add-on's privilege list.
                - IPC_LOCK
          volumeMounts:
            # OTBR's persistent state (Thread dataset, Border Agent ID).
            - name: data
              mountPath: /data
            # TUN device — required for the wpan0 virtual interface.
            - name: tun
              mountPath: /dev/net/tun
            # Note: /dev/ttyUSB1 is NOT mounted here on purpose. Akri's
            # device-plugin injects the E dongle into the pod's device
            # cgroup + filesystem because we request
            # akri.sh/akri-openthread-usb: "1" above. Adding an explicit
            # hostPath mount would double-up the device and (worse) tie the
            # deployment to the specific /dev/ttyUSB1 device name — which
            # can shift to ttyUSB0/ttyUSB2 across reboots depending on USB
            # enumeration order. Akri matches by the dongle's serial
            # number, so the device shows up regardless of its /dev/ttyUSB*
            # name. Mirrors apps/zigbee2mqtt/resources/deployment.yaml,
            # which also relies on Akri alone.
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openthread-data
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
