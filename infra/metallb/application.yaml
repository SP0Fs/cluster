apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argo-cd
spec:
  project: spof-cluster
  sources:
    - chart: metallb
      repoURL: https://metallb.github.io/metallb
      targetRevision: v0.16.1
      helm:
        releaseName: metallb
        valueFiles:
          - $values/values.yaml
    - repoURL: "https://github.com/SP0Fs/cluster.git"
      targetRevision: main
      ref: values
      path: infra/metallb
    - repoURL: "https://github.com/SP0Fs/cluster.git"
      targetRevision: main
      path: infra/metallb/resources
  destination:
    server: "https://kubernetes.default.svc"
    namespace: metallb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
