# Garbage-collects OTBR pods rejected at admission.
#
# Every OTBR pod recreation (rollout, pod delete, dongle replug) currently
# makes the kubelet reject dozens of pods with
#   UnexpectedAdmissionError: Allocate failed ... Unable to claim slot
# while Akri still counts its configuration-level slot as held by the old
# pod (upstream bug project-akri/akri#849, unfixed as of v0.14.0). The
# rejected pods never run and stay around as phase=Failed until deleted.
# Kubernetes has no TTL for Deployment-owned pods (ttlSecondsAfterFinished
# only applies to Jobs), so this CronJob deletes them every 5 minutes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: failed-pod-cleanup
  namespace: openthread
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: failed-pod-cleanup
  namespace: openthread
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: failed-pod-cleanup
  namespace: openthread
subjects:
  - kind: ServiceAccount
    name: failed-pod-cleanup
    namespace: openthread
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: failed-pod-cleanup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: failed-pod-cleanup
  namespace: openthread
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      template:
        spec:
          serviceAccountName: failed-pod-cleanup
          restartPolicy: Never
          containers:
            - name: kubectl
              image: registry.k8s.io/kubectl:v1.36.3
              args:
                - delete
                - pods
                - --namespace=openthread
                - --selector=app=openthread-border-router
                - --field-selector=status.phase=Failed
                - --ignore-not-found
                - --wait=false
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
