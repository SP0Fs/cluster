apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parking-reservation
  namespace: argo-cd

spec:
  project: spof-cluster

  source:
    repoURL: https://github.com/SP0Fs/cluster.git
    targetRevision: main
    path: apps/parking-reservation/resources

  destination:
    server: https://kubernetes.default.svc
    namespace: parking

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
