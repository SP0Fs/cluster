kubernetesDistro: k3s
useLatestContainers: true
webhookConfiguration:
  # Pre-existing 100-year self-signed cert from 2025-12-04 (still valid).
  # Setting caBundle disables the helm webhook-cert-autogen hook chain
  # (the create/patch Jobs and their SA + ClusterRoleBinding + Role +
  # RoleBinding hooks) which was getting killed mid-run by ArgoCD's
  # before-hook-creation,hook-succeeded deletion policy, leaving the
  # operation stuck on a Terminating Job.
  caBundle: 
udev:
  discovery:
    enabled: true
  configuration:
    enabled: true
    name: akri-zigbee-usb
    capacity: 1
    discoveryDetails:
      groupRecursive: true
      udevRules:
      - ATTRS{idVendor}=="10c4", ATTRS{idProduct}=="ea60"
agent:
  securityContext:
    allowPrivilegeEscalation: false
