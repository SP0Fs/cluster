# TEMPORARY: during the migration Traefik is the front door (router 80/443 ->
# Traefik NodePorts 30080/30443) and hands everything it doesn't serve itself
# to ingress-nginx, unchanged.
#
#  - :443  SNI passthrough per host -> nginx terminates TLS + mTLS as before.
#          Remove a host's route in the same commit that moves its Ingress to
#          ingressClassName: traefik (TCP routers win over HTTP routers on a match).
#  - :80   lowest-priority catch-all -> nginx (http->https redirects, and
#          ACME HTTP-01 challenges for ingresses still on the nginx class).
#
# Lives in the ingress-nginx namespace so the routes can reference the nginx
# Service without enabling cross-namespace references. Delete this file when
# ingress-nginx is removed.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: nginx-passthrough
  namespace: ingress-nginx
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`argocd.leibold.tech`)
      services:
        - name: ingress-nginx-controller
          port: 443
    - match: HostSNI(`beszel.leibold.tech`)
      services:
        - name: ingress-nginx-controller
          port: 443
    - match: HostSNI(`esp.leibold.tech`)
      services:
        - name: ingress-nginx-controller
          port: 443
    - match: HostSNI(`home.leibold.tech`)
      services:
        - name: ingress-nginx-controller
          port: 443
    - match: HostSNI(`matrix.leibold.tech`)
      services:
        - name: ingress-nginx-controller
          port: 443
    - match: HostSNI(`otbr.leibold.tech`)
      services:
        - name: ingress-nginx-controller
          port: 443
    - match: HostSNI(`pihole.leibold.tech`)
      services:
        - name: ingress-nginx-controller
          port: 443
    - match: HostSNI(`sealed-secrets.leibold.tech`)
      services:
        - name: ingress-nginx-controller
          port: 443
    - match: HostSNI(`sparky.leibold.tech`)
      services:
        - name: ingress-nginx-controller
          port: 443
    - match: HostSNI(`spotify.leibold.tech`)
      services:
        - name: ingress-nginx-controller
          port: 443
    - match: HostSNI(`z2m.leibold.tech`)
      services:
        - name: ingress-nginx-controller
          port: 443
  tls:
    passthrough: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nginx-fallback-http
  namespace: ingress-nginx
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      priority: 1
      kind: Rule
      services:
        - name: ingress-nginx-controller
          port: 80
