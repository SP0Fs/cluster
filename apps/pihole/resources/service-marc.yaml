# DNS + web UI of the marc Pi-hole (also the ingress backend).
apiVersion: v1
kind: Service
metadata:
  name: marc-pihole
  namespace: pihole
  annotations:
    metallb.io/address-pool: marc-local
    metallb.io/loadBalancerIPs: 192.168.178.128
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: pihole
    topology.kubernetes.io/zone: marc
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
