apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb
  namespace: argo-cd
  annotations:
    # Disabled: mongodb has an unresolved NFS lock issue. The live Deployment
    # crash-loops on "/data/db/mongod.lock (No locks available)". The repo
    # manifests are kept for future re-enabling (PVC + data preserved). To
    # re-enable: remove this annotation and the app will reconcile normally.
    argocd.argoproj.io/disabled: "true"
spec:
  project: spof-cluster
  source:
    repoURL: "https://github.com/SP0Fs/cluster.git"
    targetRevision: main
    path: apps/mongodb/resources
  destination:
    server: "https://kubernetes.default.svc"
    namespace: mongodb
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
