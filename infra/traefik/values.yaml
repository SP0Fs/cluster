# Traefik replaces the retired community ingress-nginx controller.
# Migration plan: docs/plans/2026-11-20-traefik-migration.md

deployment:
  replicas: 2

# Same placement as ingress-nginx: nodes labelled ingress=true, one pod per node.
nodeSelector:
  ingress: "true"

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-traefik
        topologyKey: kubernetes.io/hostname

# Only 2 ingress nodes + required anti-affinity: a surge pod could never schedule,
# so roll one pod at a time instead.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# nginx keeps the "nginx" class; migrated Ingresses opt in with ingressClassName: traefik.
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik

providers:
  kubernetesCRD:
    enabled: true
    # Ingresses reference the shared TLSOption/Middlewares in the traefik namespace
    # by name (traefik_<name>@kubernetescrd); no cross-namespace service refs needed.
    allowCrossNamespace: false
    # Collision-safe naming (recommended for new setups). References to CRD
    # objects use "_": <namespace>_<name>@kubernetescrd, e.g.
    # traefik_mtls@kubernetescrd. A reference in the legacy "-" form is not
    # resolved and its router is not created (mTLS refs: handshake refused).
    safeNaming: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true

ports:
  web:
    # New NodePorts next to nginx (32366/30197) so both can run side by side.
    # Cutover = point the router's port-forward 80/443 at these.
    nodePort: 30080
    http:
      # Reject encoded characters that no app needs and that backends may
      # decode differently than Traefik ("split view"): NUL and backslash.
      # Encoded slash etc. stay allowed (ArgoCD puts URL-encoded repo URLs in paths).
      encodedCharacters:
        allowEncodedSlash: true
        allowEncodedBackSlash: false
        allowEncodedNullCharacter: false
        allowEncodedSemicolon: true
        allowEncodedPercent: true
        allowEncodedQuestionMark: true
        allowEncodedHash: true
  websecure:
    nodePort: 30443
    http:
      # Reject encoded characters that no app needs and that backends may
      # decode differently than Traefik ("split view"): NUL and backslash.
      # Encoded slash etc. stay allowed (ArgoCD puts URL-encoded repo URLs in paths).
      encodedCharacters:
        allowEncodedSlash: true
        allowEncodedBackSlash: false
        allowEncodedNullCharacter: false
        allowEncodedSemicolon: true
        allowEncodedPercent: true
        allowEncodedQuestionMark: true
        allowEncodedHash: true
    transport:
      respondingTimeouts:
        # Traefik v3 defaults to 60s for reading the request (incl. body).
        # sparky-fitness imports and registry pushes need longer.
        readTimeout: 600s

service:
  spec:
    type: NodePort

# Dashboard/API off entirely (it was never exposed; less attack surface).
api:
  dashboard: false
ingressRoute:
  dashboard:
    enabled: false

# Measured idle usage ~1m CPU / 23Mi per pod.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Access log only for failed requests (debugging the migration without
# logging every request). Request headers are dropped by default.
accessLog:
  enabled: true
  filters:
    statusCodes: "400-599"

log:
  noColor: true

global:
  # No outbound calls to Traefik Labs (usage stats are already off by default).
  checkNewVersion: false
  sendAnonymousUsage: false
  # Drop request headers whose names alias a Traefik-managed header
  # (X_Forwarded_For / X.Forwarded.For for X-Forwarded-For). Backends like
  # nginx, PHP or Python/WSGI read those as the real header, so clients could
  # spoof X-Forwarded-* or X-Forwarded-Tls-Client-Cert otherwise.
  aliasHeadersStrategy: delete
