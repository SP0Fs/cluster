apiVersion: v1
kind: Service
metadata:
  name: matter-server
  namespace: matter
  labels:
    app: matter-server
spec:
  # Headless: the WebSocket client (HA) connects via DNS name
  # matter-server.matter.svc.cluster.local:5580/ws. No external access.
  clusterIP: None
  selector:
    app: matter-server
  ports:
    - name: ws
      port: 5580
      targetPort: 5580
      protocol: TCP