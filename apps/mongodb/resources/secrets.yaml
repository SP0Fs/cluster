---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mongo-express-auth
  namespace: mongodb
spec:
  encryptedData:
    ME_CONFIG_BASICAUTH_PASSWORD: 
    ME_CONFIG_BASICAUTH_USERNAME: 
  template:
    metadata:
      name: mongo-express-auth
      namespace: mongodb
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mongodb-root-user
  namespace: mongodb
spec:
  encryptedData:
    MONGO_INITDB_ROOT_PASSWORD: 
    MONGO_INITDB_ROOT_USERNAME: 
  template:
    metadata:
      name: mongodb-root-user
      namespace: mongodb
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: spof-cert
  namespace: mongodb
spec:
  encryptedData:
    ca.crt: 
  template:
    metadata:
      name: spof-cert
      namespace: mongodb
