apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-application
  namespace: argo-cd
spec:
  project: spof-cluster
  source:
    repoURL: https://github.com/SP0Fs/cluster.git
    path: applications
    targetRevision: main
    directory:
      recurse: true
      jsonnet: {}
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - Prune=true
