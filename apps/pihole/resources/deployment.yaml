# One Pi-hole per network. Nodes carry topology.kubernetes.io/zone=<network>;
# the API server copies that label onto each pod when it is bound
# (PodTopologyLabelsAdmission), and the per-network Services select on it.
# replicas = number of networks; anti-affinity allows one pod per zone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
  labels:
    app: pihole
spec:
  replicas: 2 # one per network
  strategy:
    rollingUpdate:
      maxSurge: 0 # a surge pod could never schedule (anti-affinity)
      maxUnavailable: 1
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: Exists
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app: pihole
      volumes:
        # Per-node state: each network's Pi-hole keeps its own config.
        - name: pihole-config
          hostPath:
            path: /mnt/pihole
            type: DirectoryOrCreate
        # One web password Secret per network, mounted as files named after the
        # network. Optional: a missing Secret never blocks startup.
        - name: webpassword
          projected:
            sources:
              - secret:
                  name: marc-pihole-webpassword
                  optional: true
                  items:
                    - key: WEBPASSWORD
                      path: marc
              - secret:
                  name: chris-pihole-webpassword
                  optional: true
                  items:
                    - key: WEBPASSWORD
                      path: chris
      containers:
        - name: cloudflared
          image: visibilityspots/cloudflared:v2026.1.2
          env:
            - name: PORT
              value: "5053"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
        - name: pihole
          image: pihole/pihole:2026.10.1
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          env:
            - name: TZ
              value: Europe/Berlin
            - name: FTLCONF_dns_upstreams
              value: 127.0.0.1#5053
            # 'all' also answers clients from the other network (backup DNS).
            - name: FTLCONF_dns_listeningMode
              value: all
            # Per-network web password: the pod's zone label (copied from the node)
            # selects the file; the image reads /run/secrets/$WEBPASSWORD_FILE.
            # If the file is missing, Pi-hole keeps the hash in pihole.toml.
            - name: ZONE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['topology.kubernetes.io/zone']
            - name: WEBPASSWORD_FILE
              value: pihole/$(ZONE)
          ports:
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 80
              name: http
              protocol: TCP
            - containerPort: 443
              name: https
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/pihole
              name: pihole-config
            - mountPath: /run/secrets/pihole
              name: webpassword
              readOnly: true
