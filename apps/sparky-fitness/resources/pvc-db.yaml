# Postgres data on hp-elitedesk's local disk at /mnt/sparky-db (next to the other local PVs).
# Static PV + claim bound by name; the DB deployment is pinned to hp-elitedesk.
# Uploads/backups stay on the NFS PVC (pvc.yaml).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sparkyfitness-db
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: sparky-fitness
    name: sparkyfitness-db
  hostPath:
    path: /mnt/sparky-db
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - hp-elitedesk
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sparkyfitness-db
  namespace: sparky-fitness
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ""
  volumeName: sparkyfitness-db
