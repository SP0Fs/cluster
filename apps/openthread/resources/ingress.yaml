apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openthread-border-router
  namespace: openthread
  annotations:
    cert-manager.io/cluster-issuer: ca-issuer
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    # mTLS auth intentionally disabled for the OTBR web UI — this is an
    # internal homelab admin tool, not a customer-facing surface. The
    # /node REST API on port 8081 (used by HA's Matter integration) is
    # NOT exposed via Ingress, only the Web GUI on port 8080.
    # If you want mTLS back, follow the same pattern as
    # apps/homeassistant/ingress.yaml and reference the shared CA secret
    # via a SealedSecret (NOT a plain Secret in git).
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - otbr.leibold.tech
      secretName: otbr-certs
  rules:
    - host: otbr.leibold.tech
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: openthread-border-router
                port:
                  number: 8080