apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: mongo-express-selfsigned
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mongo-express-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: mongo-express-root-ca
  secretName: mongo-express-root-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: mongo-express-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: mongo-express-ca-issuer
spec:
  ca:
    secretName: mongo-express-root-ca
