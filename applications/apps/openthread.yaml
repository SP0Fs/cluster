apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openthread
  namespace: argo-cd
spec:
  project: spof-cluster
  source:
    repoURL: "https://github.com/SP0Fs/cluster.git"
    targetRevision: main
    path: apps/openthread
    directory:
      recurse: true
      include: "*.yaml"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: openthread
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true