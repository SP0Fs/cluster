apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grocy
  namespace: grocy
  annotations:
    cert-manager.io/cluster-issuer: ca-issuer
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    # mTLS — same pattern as apps/openthread/resources/ingress.yaml. The CA secret
    # (`grocy/spof-cert`) is created out-of-band so the plaintext key never touches git:
    #   kubectl get secret spof-cert -n homeassistant -o yaml | \
    #     sed 's/namespace: homeassistant/namespace: grocy/' | \
    #     kubectl apply -f -
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-secret: "grocy/spof-cert"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    nginx.ingress.kubernetes.io/auth-tls-error-page: "https://insult.mattbas.org/api/insult.html"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
    # product photos
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - grocy.leibold.tech
      secretName: grocy-certs
  rules:
    - host: grocy.leibold.tech
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: grocy
                port:
                  number: 80
