controller:
  replicaCount: 2
  nodeSelector:
    ingress: "true"

  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - ingress-nginx
        topologyKey: "kubernetes.io/hostname"

  service:
    type: NodePort
    nodePorts:
      http: 32366
      https: 30197
