---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: parking-credentials
  namespace: parking
spec:
  encryptedData:
    AREA_ID: 
    CLIENT_ID: 
    IDENTITY_POOL_ID: 
    LICENSEPLATE: 
    LOCATION_ID: 
    PASSWORD: 
    PROJECT_ID: 
    REGION: 
    SECTOR_ID: 
    TIMESLOT_NAME: 
    USER_POOL_ID: 
    USERNAME: 
  template:
    metadata:
      name: parking-credentials
      namespace: parking
    type: Opaque

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-pull
  namespace: parking
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr-pull
      namespace: parking
    type: kubernetes.io/dockerconfigjson
