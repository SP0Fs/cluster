# Lovelace card for the Alltag dashboard: pick a receipt photo from the phone,
# upload it to "My media" and run script.kassenbon_einlesen with it.
# Served as /local/kassenbon-card.js (mounted into /config/www by the deployment).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kassenbon-card
  namespace: homeassistant
data:
  kassenbon-card.js: |
    const MAX_SIDE = 2000;

    class KassenbonCard extends HTMLElement {
      setConfig(config) {
        this._config = { script: "script.kassenbon_einlesen", name: "Kassenbon einlesen", ...config };
        this._status = "Foto aus der Galerie wählen";
        this._busy = false;
      }

      set hass(hass) {
        this._hass = hass;
        if (!this.shadowRoot) this._build();
      }

      getCardSize() {
        return 1;
      }

      _build() {
        const root = this.attachShadow({ mode: "open" });
        root.innerHTML = `
          <style>
            ha-card { border-radius: 32px; cursor: pointer; overflow: hidden; }
            .row { display: flex; align-items: center; gap: 12px; padding: 6px 16px 6px 6px; min-height: 44px; }
            .icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center;
                    justify-content: center; background: var(--secondary-background-color); flex: none; }
            .busy .icon { background: var(--primary-color); color: var(--text-primary-color); }
            .name { font-weight: 600; font-size: 14px; }
            .state { font-size: 12px; opacity: .7; }
            input { display: none; }
          </style>
          <ha-card>
            <div class="row">
              <div class="icon"><ha-icon icon="mdi:receipt-text-plus"></ha-icon></div>
              <div><div class="name"></div><div class="state"></div></div>
            </div>
            <input type="file" accept="image/*">
          </ha-card>`;
        this._input = root.querySelector("input");
        root.querySelector("ha-card").addEventListener("click", () => {
          if (!this._busy) this._input.click();
        });
        this._input.addEventListener("change", () => this._handle(this._input.files[0]));
        this._render();
      }

      _render() {
        const root = this.shadowRoot;
        root.querySelector(".name").textContent = this._config.name;
        root.querySelector(".state").textContent = this._status;
        root.querySelector(".row").classList.toggle("busy", this._busy);
      }

      _setStatus(text, busy) {
        this._status = text;
        this._busy = busy;
        this._render();
      }

      // Phone photos are large; a 2000 px JPEG is plenty for the receipt text and uploads fast.
      async _shrink(file) {
        try {
          const img = await createImageBitmap(file);
          const scale = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          return await new Promise((res) => canvas.toBlob(res, "image/jpeg", 0.85));
        } catch (e) {
          return file;
        }
      }

      async _handle(file) {
        if (!file) return;
        this._input.value = "";
        try {
          this._setStatus("Lade hoch…", true);
          const blob = await this._shrink(file);
          const stamp = new Date().toISOString().replace(/[-:]/g, "").replace("T", "_").slice(0, 15);
          const name = `kassenbon_${stamp}.jpg`;
          const form = new FormData();
          form.append("media_content_id", "media-source://media_source/local");
          form.append("file", new File([blob], name, { type: "image/jpeg" }));
          const resp = await this._hass.fetchWithAuth("/api/media_source/local_source/upload", {
            method: "POST",
            body: form,
          });
          if (!resp.ok) throw new Error(`Upload fehlgeschlagen (${resp.status})`);
          const { media_content_id } = await resp.json();
          await this._hass.callService("script", "turn_on", {
            entity_id: this._config.script,
            variables: { foto: { media_content_id, media_content_type: "image/jpeg" } },
          });
          this._setStatus("Wird ausgewertet – Ergebnis kommt als Benachrichtigung", false);
        } catch (e) {
          this._setStatus(`Fehler: ${e.message}`, false);
        }
      }
    }

    customElements.define("kassenbon-card", KassenbonCard);
    window.customCards = window.customCards || [];
    window.customCards.push({ type: "kassenbon-card", name: "Kassenbon", description: "Kassenbon-Foto hochladen und einlesen" });
