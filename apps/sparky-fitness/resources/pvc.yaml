# NFS volume for uploads and in-app backups (via subPath). Postgres data is on local disk (pvc-db.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sparkyfitness-data
  namespace: sparky-fitness
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: ssd
